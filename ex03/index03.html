<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists and Tables</title>
</head>
<body>

    <h2>Programming Languages</h2>
    <ul>
        <li>Python</li>
        <li>C\php</li>
        <li>Java</li>
    </ul>

    <h2>Steps</h2>
    <ol>
        <li>Plan the project</li>
        <li>Write code
            <ul>
                <li>HTML Structure</li>
                <li>CSS Styling</li>
            </ul>
        </li>
        <li>Test and Deploy</li>
    </ol>

    <h2>Weekly Timetable</h2>
    <table>
        <caption>Weekly Study Schedule</caption>
        <thead>
            <tr>
                <th scope="col">Day</th>
                <th scope="col">Subject</th>
                <th scope="col">Hours</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sunday</td>
                <td>HTML and CSS</td>
                <td>2 </td>
            </tr>
            <tr>
                <td>Monday</td>
                <td>Cybersecurity</td>
                <td>3 </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
